name: daily-pipeline

# Runs the real Airflow DAG once a day on a fresh GitHub machine, then saves the data.
on:
  schedule:
    - cron: "30 6 * * *"          # 06:30 UTC; prices refresh around 03:00 UTC
    - cron: "30 10 * * *"         # backup: GitHub can delay or drop scheduled runs; skipped if 06:30 passed
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (blank = today). Use this to backfill a day."
        required: false

permissions:
  contents: write
  pages: write      # publish the dbt docs site
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  AIRFLOW_VERSION: "3.3.2"
  PYTHON_VERSION: "3.12"
  DBT_DUCKDB_VERSION: "1.11.1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      INPUT_DATE: ${{ inputs.date }}
    outputs:
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the date (skip the backup run if today already passed)
        id: pick
        run: |
          DS="${INPUT_DATE:-$(date -u +%F)}"
          [[ "$DS" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date: $DS"; exit 1; }
          echo "DS=$DS" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && grep -qs '"status": "passed"' "lake/_health/runs/$DS.json"; then
            echo "Today's run already passed; nothing to do."; echo "SKIP=1" >> "$GITHUB_ENV"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Airflow and pipeline deps
        if: env.SKIP != '1'
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install -r requirements.txt
      - name: Install dbt in its own virtualenv (keeps Airflow's pins clean)
        if: env.SKIP != '1'
        run: |
          python -m venv .venv-dbt
          .venv-dbt/bin/pip install -q "dbt-duckdb==${DBT_DUCKDB_VERSION}"
          echo "DBT_BIN=${GITHUB_WORKSPACE}/.venv-dbt/bin/dbt" >> "$GITHUB_ENV"
      - name: Run the DAG
        if: env.SKIP != '1'
        run: |
          airflow db migrate
          airflow dags test pokemon_prices "$DS"
      - name: Fail the job if any stage failed
        if: always() && env.SKIP != '1'
        run: |
          python - <<'PY'
          import json, os, sys
          path = f"lake/_health/runs/{os.environ['DS']}.json"
          r = json.load(open(path)) if os.path.exists(path) else {"status": "no record"}
          print(json.dumps(r, indent=2))
          sys.exit(0 if r.get("status") == "passed" else 1)
          PY
      - name: Build dbt docs (models, tests, lineage)
        if: env.SKIP != '1'
        run: |
          "$DBT_BIN" docs generate --project-dir dbt --profiles-dir dbt --static
          mkdir -p _site && cp dbt/target/static_index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: env.SKIP != '1'
        with:
          path: _site
      - name: Save the day's data and run record (failed runs too, so monitoring sees them)
        if: always() && env.SKIP != '1'
        run: |
          git config user.name "pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lake
          git commit -m "data: prices for ${DS}" || { echo "nothing new"; exit 0; }
          git pull --rebase && git push

  docs:
    needs: run
    if: needs.run.outputs.skip != '1'   # skipped backup run builds no docs, so nothing to deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
