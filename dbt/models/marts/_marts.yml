version: 2

models:
  - name: fct_daily_prices
    description: >
      Main analysis table. Grain: one row per card x marketplace (source) x variant x
      price_date, only rows with a market price. Adds day-on-day change and trailing
      7-calendar-day statistics for spike detection. Use this table for price questions.
    columns:
      - name: price_key
        description: Surrogate key, md5 of card_id, source, variant and price_date.
        data_tests: [unique, not_null]
      - name: market
        description: Headline price in the row's currency (EUR for cardmarket, USD for tcgplayer).
      - name: prev_market
        description: Market price exactly one calendar day earlier; null if that day is missing.
      - name: avg_prev_7d
        description: Average market price over the 7 calendar days before price_date.
      - name: sd_prev_7d
        description: Sample standard deviation of market price over the same 7 days.
      - name: n_prev_7d
        description: Number of prior days with a price inside the 7-day window.
      - name: day_change_pct
        description: Percent change vs exactly yesterday; null when yesterday is missing.
      - name: zscore_7d
        description: (market - avg_prev_7d) / sd_prev_7d. How unusual today's price is vs the past week.
      - name: is_spike
        description: >
          True when abs(zscore_7d) >= 3, there are at least 5 prior days in the window,
          and the price (or its average) is at least 2 in its currency.

  - name: price_spikes
    description: >
      Rows of fct_daily_prices where is_spike is true, exported to the lake for
      alerting. Grain: one row per spiking card x marketplace x variant x price_date.

unit_tests:
  - name: spike_flagged_only_after_enough_history
    description: >
      Seven ordinary days then a jump to double the price. Only the jump is a spike;
      early days lack history, and normal wobble stays under the threshold.
    model: fct_daily_prices
    given:
      - input: ref('stg_prices')
        rows:
          - {price_key: k1, price_date: 2026-11-01, card_id: c, source: tcgplayer, variant: holofoil, market: 10}
          - {price_key: k2, price_date: 2026-11-02, card_id: c, source: tcgplayer, variant: holofoil, market: 11}
          - {price_key: k3, price_date: 2026-11-03, card_id: c, source: tcgplayer, variant: holofoil, market: 9}
          - {price_key: k4, price_date: 2026-11-04, card_id: c, source: tcgplayer, variant: holofoil, market: 10}
          - {price_key: k5, price_date: 2026-11-05, card_id: c, source: tcgplayer, variant: holofoil, market: 11}
          - {price_key: k6, price_date: 2026-11-06, card_id: c, source: tcgplayer, variant: holofoil, market: 9}
          - {price_key: k7, price_date: 2026-11-07, card_id: c, source: tcgplayer, variant: holofoil, market: 10}
          - {price_key: k8, price_date: 2026-11-08, card_id: c, source: tcgplayer, variant: holofoil, market: 20}
    expect:
      rows:
        - {price_key: k1, is_spike: false}
        - {price_key: k2, is_spike: false}
        - {price_key: k3, is_spike: false}
        - {price_key: k4, is_spike: false}
        - {price_key: k5, is_spike: false}
        - {price_key: k6, is_spike: false}
        - {price_key: k7, is_spike: false}
        - {price_key: k8, is_spike: true}

  - name: day_change_ignores_gaps
    description: >
      A missing day must not turn "change vs yesterday" into "change vs two days ago".
    model: fct_daily_prices
    given:
      - input: ref('stg_prices')
        rows:
          - {price_key: a1, price_date: 2026-11-01, card_id: c, source: tcgplayer, variant: holofoil, market: 10}
          - {price_key: a2, price_date: 2026-11-02, card_id: c, source: tcgplayer, variant: holofoil, market: 12}
          - {price_key: a4, price_date: 2026-11-04, card_id: c, source: tcgplayer, variant: holofoil, market: 15}
    expect:
      rows:
        - {price_key: a1, day_change_pct: null}
        - {price_key: a2, day_change_pct: 20.0}
        - {price_key: a4, day_change_pct: null}
