version: 2

models:
  - name: stg_prices
    columns:
      - name: price_key
        data_tests: [unique, not_null]
      - name: price_date
        data_tests: [not_null]
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [cardmarket, tcgplayer]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: [EUR, USD]
      - name: market
        data_tests: [positive]
